[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "/dev/null"

# Anchor 0.32.1 requires [provider] to parse the workspace. The localnet-only
# cluster and deliberately unusable /dev/null wallet are compile sentinels,
# not deployment configuration. Task 1.1 intentionally has no [programs.*]
# entry, dedicated Program ID, deployable entrypoint, or signing key.
