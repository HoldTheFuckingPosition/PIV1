[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "/dev/null"

# Anchor 0.32.1 requires [provider] to parse the workspace. The localnet-only
# cluster and deliberately unusable /dev/null wallet are compile sentinels,
# not deployment configuration. No [programs.*] entry, dedicated live Program ID
# or signing key is configured. The native claim boundary receives runtime ID;
# this sentinel does not authorize Anchor/SBF builds or deployment.
