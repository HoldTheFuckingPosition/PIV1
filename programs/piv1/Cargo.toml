[package]
name = "piv1"
version = "0.1.0"
description = "PIV1 accounting library and isolated KIF claim instruction boundary"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "piv1"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang.workspace = true
piv1-math.workspace = true
# Canonical legacy 165-byte token decoding; already used by the accepted spike.
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
