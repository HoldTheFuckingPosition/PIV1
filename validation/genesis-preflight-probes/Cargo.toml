[workspace]
members = ["callee", "caller"]
resolver = "2"

[workspace.dependencies]
anchor-lang = "=0.32.1"
piv1 = { path = "../../programs/piv1", features = ["no-entrypoint"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
