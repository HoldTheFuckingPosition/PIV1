[workspace]
members = ["callee", "caller", "token"]
resolver = "2"

[workspace.dependencies]
anchor-lang = "=0.32.1"
piv1 = { path = "../../programs/piv1", features = ["no-entrypoint"] }
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
