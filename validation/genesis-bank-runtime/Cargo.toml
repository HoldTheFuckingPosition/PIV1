[package]
name = "piv1-genesis-bank-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
autotests = false

[workspace]
exclude = ["vendor/proc-macro-error2-2.0.1"]

[dependencies]
solana-runtime = { version = "=4.2.0", features = ["agave-unstable-api", "dev-context-only-utils"] }
solana-account = "=4.3.1"
solana-genesis-config = { version = "=4.0.0", features = ["serde"] }
solana-message = "=4.4.0"
solana-transaction = "=4.1.5"
solana-pubkey = "=4.2.0"
solana-hash = "=4.5.0"
# Preserve the existing wincode 0.5 SDK trait boundary during isolated resolution.
solana-address = { version = "=2.6.1", default-features = false }
solana-short-vec = { version = "=3.2.2", default-features = false }
serde_json = "=1.0.151"
solana-svm = { version = "=4.2.0", features = ["agave-unstable-api"] }
solana-transaction-error = "=3.3.2"
solana-instruction-error = "=2.4.0"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
# The locked five8 1.0.0 path uses core 0.1.2; SDK decode errors need its Error impl.
five8_core = { version = "=0.1.2", default-features = false, features = ["std"] }
solana-instruction = "=3.4.0"
solana-sdk-ids = "=3.1.0"
solana-loader-v3-interface = { version = "=7.0.0", features = ["bincode"] }
solana-compute-budget-interface = "=3.0.0"
sha2 = "=0.10.9"
bincode = "=1.3.3"

[[test]]
name = "bank"
path = "tests/bank.rs"

[[test]]
name = "genesis_bank"
path = "tests/genesis_bank.rs"

[patch.crates-io]
# Rust 1.97.1 compatibility: make the existing hidden proc_macro reexport public.
proc-macro-error2 = { version = "=2.0.1", path = "vendor/proc-macro-error2-2.0.1" }
