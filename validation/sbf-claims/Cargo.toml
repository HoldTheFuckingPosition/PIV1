[package]
name = "piv1-sbf-claims-validation"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
autotests = false

[workspace]

[dependencies]
piv1 = { path = "../../programs/piv1", features = ["no-entrypoint"] }
anchor-lang = "=0.32.1"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
mollusk-svm = { version = "=0.15.1", default-features = false, features = ["inner-instructions", "invocation-inspect-callback"] }
solana-account = "=4.3.1"
solana-instruction = "=3.4.0"
solana-pubkey = "=4.2.0"
# Match Mollusk's revision-bound SDK lock: address 2.7 switches to incompatible
# wincode 0.6 traits while instruction 3.4.0 requires the 0.5 traits.
solana-address = { version = "=2.6.1", default-features = false }
# ShortU16 crosses the same wincode 0.5 message/transaction trait boundary.
solana-short-vec = { version = "=3.2.2", default-features = false }
solana-rent = { version = "=4.3.0", features = ["serde"] }
solana-instruction-error = "=2.4.0"
solana-transaction-error = "=3.3.2"
solana-compute-budget = { version = "=4.2.0", features = ["agave-unstable-api"] }
solana-program-runtime = { version = "=4.2.0", features = ["agave-unstable-api"] }
solana-transaction-context = { version = "=4.2.0", features = ["agave-unstable-api", "dev-context-only-utils"] }
solana-svm-log-collector = { version = "=4.2.0", features = ["agave-unstable-api"] }
bincode = "=1.3.3"
sha2 = "=0.10.9"

[[test]]
name = "claims"
path = "tests/claims.rs"
