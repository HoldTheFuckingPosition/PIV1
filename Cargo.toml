[workspace]
members = [
    "crates/piv1-math",
    "programs/piv1",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
anchor-lang = "=0.32.1"
piv1-math = { path = "crates/piv1-math" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
